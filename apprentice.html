<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バッテリー交換手順 - 工具・注意事項</title>
    <link rel="icon" href="./images/favicon.ico" type="image/x-icon">
    <style>
        /* モダン＆レスポンシブなベースデザイン */
        :root {
            --primary: #3498db;
            --primary-hover: #2980b9;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --warning-bg: #fffbeb;
            --warning-border: #f59e0b;
            --warning-text: #b45309;
            --success: #10b981;
            --success-hover: #059669;
        }

        body {
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            line-height: 1.7;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* アニメーション付きのカードスタイル */
        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 24px;
            border-bottom: 4px solid var(--primary);
            padding-bottom: 12px;
            display: inline-block;
        }

        /* メタ情報（難易度・時間） */
        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 30px;
        }

        .meta-item {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .meta-label {
            font-size: 13px;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .meta-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* 警告・重要事項エリア */
        .warning-box {
            background-color: var(--warning-bg);
            border-left: 5px solid var(--warning-border);
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 35px;
        }

        .warning-box h3 {
            margin-top: 0;
            color: var(--warning-text);
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .warning-box ul {
            margin: 0;
            padding-left: 20px;
            color: #78350f;
        }

        .warning-box li {
            margin-bottom: 10px;
            font-weight: 500;
        }

        /* セクション見出し */
        .section-title {
            font-size: 20px;
            color: #0f172a;
            margin-top: 40px;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 工具のグリッドレイアウト（レスポンシブ） */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .tool-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.05);
        }

        /* 工具の写真が入るスペース */
        .tool-image-placeholder {
            width: 100%;
            height: 140px;
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }

        .tool-image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .tool-name {
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            color: var(--text-main);
            background: #fff;
            border-top: 1px solid #e2e8f0;
        }

        /* 必須工具：左端に太い赤ライン */
.tool-card.required {
  border-left: 5px solid #e74c3c !important;
}

/* 任意工具：左端に落ち着いたグレーライン */
.tool-card.optional {
  border-left: 5px solid #94a3b8 !important;
}

/* 右上テキスト（必須／任意）の共通スタイル */
.tool-status {
  font-weight: bold;
  float: right; /* カードの右上に配置 */
  font-size: 0.85rem;
}

/* 必須の文字色 */
.tool-card.required .tool-status {
  color: #e74c3c;
}

/* 任意の文字色 */
.tool-card.optional .tool-status {
  color: #64748b;
}


        /* フッターボタンエリア */
        .action-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 40px;
            align-items: center;
        }

        .btn-next {
            display: block;
            width: 100%;
            max-width: 400px;
            padding: 18px;
            background-color: var(--success);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
        }

        .btn-next:hover {
            background-color: var(--success-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-back {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: var(--primary);
        }

        /* 写真拡大ポップアップ（モーダル）のCSS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* アクティブ状態のときだけ表示 */
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            max-width: 480px;
            width: 85%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 34px;
            height: 34px;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
            transition: all 0.2s;
        }

        .modal-close:hover {
            background-color: #dc2626;
            transform: scale(1.1);
        }

        .modal-image-wrap {
            width: 100%;
            max-height: 45vh;
            overflow: hidden;
            border-radius: 12px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-image-wrap img {
            max-width: 100%;
            max-height: 45vh;
            object-fit: contain;
        }

        .modal-caption {
            margin-top: 18px;
            margin-bottom: 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* 横幅が狭いスマホ向けの調整 */
        @media (max-width: 600px) {
            .wrapper { padding: 20px 12px; }
            .card { padding: 24px; border-radius: 12px; }
            .meta-grid { grid-template-columns: 1fr; gap: 12px; }
            h1 { font-size: 22px; }
            .tools-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .tool-image-placeholder { height: 100px; font-size: 12px; }
            .tool-name { padding: 10px; font-size: 13px; }
            .modal-content { padding: 16px; width: 90%; }
            .modal-close { top: -10px; right: -10px; width: 30px; height: 30px; font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card" id="info-area">
        <h1 id="device-name">読み込み中...</h1>

        <div class="meta-grid">
            <div class="meta-item">
                <span class="meta-label">Difficulty</span>
                <span id="txt-difficulty" class="meta-value">--</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">Estimated Time</span>
                <span id="txt-time" class="meta-value">--</span>
            </div>
        </div>

        <div class="warning-box">
            <h3>⚠️ 作業を始める前の重要注意事項</h3>
            <ul id="list-warnings"></ul>
        </div>

        <div class="section-title">🛠️ 必要な工具・用意するもの</div>
        <div class="tools-grid" id="tools-container"></div>

        <div class="action-area">
            <span style="font-size: 16px; color: var(--text-main); font-weight: bold;">バッテリーと工具のセットでの購入を推奨</span>
            <span style="font-size: 14px; color: var(--text-sub); font-weight: bold;"><br>※がついているものは必須ではない</span>
            <a href="#" id="next-page-btn" class="btn-next">注意点を確認して手順へ進む →</a>
            <a href="front.html" class="btn-back">← 機種選択に戻る</a>
        </div>
    </div>
</div>

<div id="image-modal" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-close" id="modal-close-btn">×</button>
        <div class="modal-image-wrap">
            <img id="modal-img" src="" alt="工具の拡大写真">
        </div>
        <p id="modal-caption" class="modal-caption"></p>
    </div>
</div>

<script>
    // 機種データベース
    const deviceData = {
        "googlepixel7": {
            name: "Google Pixel 7",
            difficulty: "上級者向け（画面側から開封するため、液晶を破損させるリスクが非常に高いです）",
            time: "約 60分 〜 90分",
            tools: [
                { name: "トルクスドライバー T3（精密・高品質推奨）", img: "images/t3.jpg", desc: "トルクスドライバー T3"},
                { name: "ピンセット（極細・高剛性）", img: "images/tweezers.jpg", desc: "ピンセット"},
                { name: "吸盤（スクリーンオープナー）", img: "images/opener.jpg", desc: "吸盤（スクリーンオープナー）"},
                { name: "プラスチック製ピック（複数枚）", img: "images/picks.jpg", desc: "プラスチック製ピック"},
                { name: "ヒートガン（またはドライヤー）", img: "images/heatgun.jpg", desc: "ヒートガン"},
                { name: "スパッジャー（プラスチック製）", img: "images/spudger.jpg", desc: "スパッジャー"},
                { name: "替えのスクリーン用接着剤", img: "images/adhesive.jpg", desc: "替えのスクリーン用接着剤"},
                { name: "釣り糸", img: "images/turiito.jpg", desc: "釣り糸"},
                { name: "※ グラファイトシート", img: "images/sheet.jpg", desc: "グラファイトシート"},
                { name: "※ 放熱用シリコングリス", img: "images/grease.jpg", desc: "放熱用シリコングリス"},
                { name: "※ 家庭用ファイヤーブランケット", img: "images/fireblancket.jpg", deac:"家庭用ファイヤーブランケット"}
                
            ],
            warnings: [
                "Google Pixel 7は画面（ディスプレイ）側を加熱して剥がす構造です。有機ELディスプレイは非常に薄くデリケートなため、こじ開ける際に割ってしまうリスクが他の機種より圧倒的に高いので注意して作業してください。",
                "事前に必ずGoogleアカウントの同期、およびデータの完全バックアップを行ってください。",
                "バッテリーに少しでも傷をつけたり変形させると、内部ショートによる発火を招くため、絶対に金属製の工具でバッテリーを突かないでください。",
                "ご自身での分解・修理は自己責任となります。防水性能の低下や、メーカー正規修理の受付対象外となるリスクをご了承ください。"
            ]
        },
        "googlepixel8": {
            name: "Google Pixel 8",
            difficulty: "上級者向け（画面側から開封するため、液晶を破損させるリスクが非常に高いです）",
            time: "約 60分 〜 90分",
            tools: [
                { name: "トルクスドライバー T2（精密・高品質推奨）", img: "images/t2.jpg", desc: "トルクスドライバー T2" },
                { name: "トルクスドライバー T3（精密・高品質推奨）", img: "images/t3.jpg", desc: "トルクスドライバー T3" },
                { name: "ピンセット（極細・高剛性）", img: "images/tweezers.jpg", desc: "ピンセット" },
                { name: "吸盤（スクリーンオープナー）", img: "images/opener.jpg", desc: "吸盤（スクリーンオープナー）" },
                { name: "プラスチック製ピック（複数枚）", img: "images/picks.jpg", desc: "プラスチック製ピック" },
                { name: "ヒートガン（またはドライヤー）", img: "images/heatgun.jpg", desc: "ヒートガン" },
                { name: "スパッジャー（プラスチック製）", img: "images/spudger.jpg", desc: "スパッジャー" },
                { name: "替えのスクリーン用接着剤（カット済み推奨）", img: "images/adhesive.jpg", desc: "替えのスクリーン用接着剤" },
                { name: "（補足）放熱用シリコングリス", img: "images/grease.jpg", desc: "（補足）放熱用シリコングリス" },
                { name: "（補足）グラファイトシート", img: "images/sheet.jpg", desc: "（補足）グラファイトシート" }
            ],
            warnings: [
                "Google Pixel 8は画面（ディスプレイ）側を加熱して剥がす構造です。有機ELディスプレイは非常に薄くデリケートなため、こじ開ける際に割ってしまうリスクが他の機種より圧倒的に高いので覚悟して作業してください。",
                "事前に必ずGoogleアカウントの同期、およびデータの完全バックアップを行ってください。",
                "バッテリーに少しでも傷をつけたり変形させると、内部ショートによる発火を招くため、絶対に金属製の工具でバッテリーを突かないでください。",
                "ご自身での分解・修理は完全に自己責任となります。防水性能の低下や、メーカー正規修理の受付対象外となるリスクをご了承ください。"
            ]
        },
        "iphone13": {
            name: "iPhone 13",
            difficulty: "中級者向け",
            time: "約 45分 〜 60分",
            tools: [
                { name: "星型ドライバー (P2)", img: "images/p2.jpg", desc: "星型ドライバー (P2)" },
                { name: "Y字ドライバー", img: "images/y_screw.jpg", desc: "Y字ドライバー" },
                { name: "吸盤", img: "images/opener.jpg", desc: "吸盤" },
                { name: "プラスチック製ピック", img: "images/picks.jpg", desc: "プラスチック製ピック" }
            ],
            warnings: [
                "作業前に必ずiCloudへのバックアップを行ってください。",
                "自己責任での作業となります。"
            ]
        }
    };

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const deviceKey = urlParams.get('device');

        if (deviceKey && deviceData[deviceKey]) {
            const data = deviceData[deviceKey];

            document.getElementById('device-name').innerText = data.name + " 分解前の準備";
            document.getElementById('txt-difficulty').innerText = data.difficulty;
            document.getElementById('txt-time').innerText = data.time;

            const warningsList = document.getElementById('list-warnings');
            data.warnings.forEach(warning => {
                const li = document.createElement('li');
                li.innerText = warning;
                warningsList.appendChild(li);
            });

            const toolsContainer = document.getElementById('tools-container');
            data.tools.forEach(tool => {
                const toolCard = document.createElement('div');
                toolCard.className = 'tool-card';

                // 1. 名前に「※」が含まれているかどうかで【任意】か【必須】かを判定
                const isOptional = tool.name.includes("※");
                const statusClass = isOptional ? 'optional' : 'required';
                const statusText = isOptional ? '【任意】' : '【必須】';

                // 2. 判定結果に応じてクラスを付与 (CSSで左端の色帯がつきます)
                toolCard.className = `tool-card ${statusClass}`;

                const imgPlaceholder = document.createElement('div');
                imgPlaceholder.className = 'tool-image-placeholder';
                imgPlaceholder.innerText = 'NO IMAGE';

                const imgTag = document.createElement('img');
                imgTag.src = tool.img;
                imgTag.alt = tool.name;
                imgPlaceholder.appendChild(imgTag);

                const toolName = document.createElement('div');
                toolName.className = 'tool-name';
                toolName.innerText = tool.name;

                // 3. 工具名の横に【必須】または【任意】を表示
                toolName.innerHTML = `<span class="tool-status">${statusText}</span>${tool.name}`;

                toolCard.appendChild(imgPlaceholder);
                toolCard.appendChild(toolName);

                // カードをタップしたら拡大モーダルを開く処理
                toolCard.addEventListener('click', () => {
                    document.getElementById('modal-img').src = tool.img;
                    document.getElementById('modal-caption').innerText = tool.desc || tool.name; // descが無ければnameをセット
                    document.getElementById('image-modal').classList.add('active');
                });

                toolsContainer.appendChild(toolCard);
            });

            const nextBtn = document.getElementById('next-page-btn');
            nextBtn.href = `caution.html?device=${deviceKey}`;

        } else {
            document.getElementById('device-name').innerText = "エラー";
            document.getElementById('info-area').innerHTML = `
                <h2 style="text-align:center;color:#e11d48;">機種データが見つかりません</h2>
                <p style="text-align:center;color:var(--text-sub);">トップページからもう一度選択し直してください。</p>
                <div style="text-align:center;margin-top:20px;"><a href="front.html" class="btn-back">← トップページに戻る</a></div>
            `;
        }

        // モーダルを閉じる関数
        const closeModal = () => {
            document.getElementById('image-modal').classList.remove('active');
        };

        // ✕ボタンを押した時
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        
        // 背景の黒い部分を押した時にも閉じる
        document.getElementById('image-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('image-modal')) {
                closeModal();
            }
        });
    });
</script>

</body>
</html>
