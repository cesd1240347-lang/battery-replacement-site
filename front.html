
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バッテリー交換ガイド - 機種選択</title>
    <link rel="icon" href="./images/favicon.ico" type="image/x-icon">

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: #333;
        }

        header {
            background-color: #1a252f;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        .step-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-select {
            padding: 15px;
            border: 2px solid #ddd;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-select:hover {
            border-color: #3498db;
            background-color: #f7fafd;
        }

        .btn-select.active {
            border-color: #3498db;
            background-color: #3498db;
            color: #fff;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            background-color: #fff;
        }

        .hidden {
            display: none;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background-color: #27ae60;
        }

        .error-message {
            color: #e74c3c;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>バッテリー交換ガイド</h1>
    <p>あなたのデバイスに合った安全な交換手順をご案内します</p>
</header>

<div class="container">
    <h2>対象の機種を見つける</h2>

    <div class="step-section">
        <label>STEP 1: OSを選択してください</label>
        <div class="btn-group">
            <button class="btn-select" onclick="selectOS('ios', this)">
                iOS (iPhone)
            </button>
            <button class="btn-select" onclick="selectOS('android', this)">
                Android
            </button>
        </div>
    </div>

    <div id="step-maker" class="step-section hidden">
        <label>STEP 2: メーカーを選択してください</label>
        <div id="maker-buttons" class="btn-group"></div>
    </div>

    <div id="step-device" class="step-section hidden">
        <label>STEP 3: 機種名を選択してください</label>
        <select id="device-select" onchange="enableSubmit()">
            <option value="">-- 機種を選択してください --</option>
        </select>
    </div>

    <button id="submit-btn"
            class="submit-btn hidden"
            onclick="goToProcedure()">
        この機種の交換手順を見る
    </button>

    <div id="error-msg" class="error-message hidden"></div>
</div>

<script>

    // 機種データベース
    const database = {
        ios: {
            Apple: [
                {
                    name: "iPhone 13",
                    url: "iphone13",
                    isImplemented: true
                },
                {
                    name: "iPhone 14",
                    url: "iphone14",
                    isImplemented: true
                }
            ]
        },

        android: {
            Google: [
                {
                    name: "Google Pixel 8",
                    url: "googlepixel8",
                    isImplemented: false
                },
                {
                    name: "Google Pixel 7",
                    url: "googlepixel7",
                    isImplemented: true
                }
            ],

            Samsung: [
                {
                    name: "Galaxy S22",
                    url: "galaxys22",
                    isImplemented: true
                },
                {
                    name: "Galaxy S23",
                    url: "galaxys23",
                    isImplemented: true
                }
            ]
        }
    };

    let selectedOS = '';
    let selectedMaker = '';

    // STEP 1: OS選択
    function selectOS(os, element) {
        selectedOS = os;
        selectedMaker = '';

        element.parentNode
            .querySelectorAll('.btn-select')
            .forEach(b => b.classList.remove('active'));

        element.classList.add('active');

        const makerContainer =
            document.getElementById('maker-buttons');

        makerContainer.innerHTML = '';

        const makers = Object.keys(database[os]);

        makers.forEach(maker => {
            const btn = document.createElement('button');

            btn.className = 'btn-select';
            btn.innerText = maker;
            btn.onclick = () => selectMaker(maker, btn);

            makerContainer.appendChild(btn);
        });

        document.getElementById('step-maker')
            .classList.remove('hidden');

        document.getElementById('step-device')
            .classList.add('hidden');

        document.getElementById('submit-btn')
            .classList.add('hidden');

        document.getElementById('error-msg')
            .classList.add('hidden');
    }

    // STEP 2: メーカー選択
    function selectMaker(maker, element) {
        selectedMaker = maker;

        document.querySelectorAll('#maker-buttons .btn-select')
            .forEach(b => b.classList.remove('active'));

        element.classList.add('active');

        const deviceSelect =
            document.getElementById('device-select');

        deviceSelect.innerHTML =
            '<option value="">-- 機種を選択してください --</option>';

        const devices = database[selectedOS][maker];

        devices.forEach(device => {
            const opt = document.createElement('option');

            opt.value = device.url;
            opt.innerText = device.name;
            opt.dataset.implemented = device.isImplemented;

            deviceSelect.appendChild(opt);
        });

        document.getElementById('step-device')
            .classList.remove('hidden');

        document.getElementById('submit-btn')
            .classList.add('hidden');

        document.getElementById('error-msg')
            .classList.add('hidden');
    }

    // STEP 3: 機種選択
    function enableSubmit() {
        const deviceSelect =
            document.getElementById('device-select');

        const submitBtn =
            document.getElementById('submit-btn');

        const errorMsg =
            document.getElementById('error-msg');

        errorMsg.classList.add('hidden');

        if (deviceSelect.value) {
            submitBtn.classList.remove('hidden');
        } else {
            submitBtn.classList.add('hidden');
        }
    }

    // 交換手順ページへの遷移
    function goToProcedure() {
        const deviceSelect =
            document.getElementById('device-select');

        const deviceKey = deviceSelect.value;

        const selectedOption =
            deviceSelect.options[deviceSelect.selectedIndex];

        const errorMsg =
            document.getElementById('error-msg');

        if (!deviceKey) {
            return;
        }

        errorMsg.classList.add('hidden');

        // Google Pixelシリーズ以外は
        // すべてiPhone 14と同じページへ遷移
        if (!deviceKey.startsWith('googlepixel')) {
            window.location.href =
                "apprentice.html?device=iphone14";
            return;
        }

        // Google Pixelシリーズは従来どおり
        if (selectedOption.dataset.implemented === "false") {
            errorMsg.innerText =
                "この機種の交換手順は見つかりませんでした。";

            errorMsg.classList.remove('hidden');
        } else {
            window.location.href =
                "apprentice.html?device=" +
                encodeURIComponent(deviceKey);
        }
    }

</script>

</body>
</html>
